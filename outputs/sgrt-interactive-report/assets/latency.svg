<g fill="#fffdf7" stroke="#3f5a50" stroke-width="2"><circle cx="97" cy="224" r="31"/><circle cx="246" cy="224" r="31"/><circle cx="395" cy="224" r="31"/><circle cx="544" cy="224" r="31"/><circle cx="693" cy="224" r="31"/></g>
<g text-anchor="middle"><text x="97" y="231">01</text><text x="246" y="231">02</text><text x="395" y="231">03</text><text x="544" y="231">04</text><text x="693" y="231">05</text><text x="97" y="287">采集</text><text x="246" y="287">重建</text><text x="395" y="287">配准</text><text x="544" y="287">传输</text><text x="693" y="287">设备响应</text></g>
