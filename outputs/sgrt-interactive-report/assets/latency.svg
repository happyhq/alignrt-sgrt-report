<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">端到端延迟包含完整处理链</title><desc id="desc">依据原始入门PPT独立绘制的概念示意，不表示实际尺寸、临床阈值或设备参数。</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#dedad0" stroke-width=".5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#94483d" stroke-width="1.3"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#293a35;font-size:19px}.small{font-size:15px;fill:#677169}.label{font-size:20px;font-weight:600}.red{fill:#94483d}.line{fill:none;stroke:#3f5a50;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#89968b;stroke-width:1}.accent{fill:none;stroke:#94483d;stroke-width:1.6;stroke-linecap:round}.paper{fill:#fffdf7;stroke:#c7cdbf;stroke-width:1}.point{fill:#94483d}</style><rect width="800" height="520" fill="#fffdf7"/><text x="40" y="53" class="small">SGRT / TECHNICAL PRINCIPLES</text>
